# Decap CMS — the Deccan Times newsroom at /admin
# Editors log in with email + password through DecapBridge (https://decapbridge.com).
# Replace YOUR-DECAPBRIDGE-SITE-ID (2 places) with the site ID from your
# DecapBridge dashboard. See README.md → "Admin panel login".
backend:
  name: git-gateway
  repo: dragonfruit0/deccan-times
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/YOUR-DECAPBRIDGE-SITE-ID/pkce
  auth_token_endpoint: /sites/YOUR-DECAPBRIDGE-SITE-ID/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "News: publish “{{slug}}” — {{author-name}}"
    update: "News: update “{{slug}}” — {{author-name}}"
    delete: "News: remove “{{slug}}” — {{author-name}}"
    uploadMedia: "Upload “{{path}}” — {{author-name}}"
    deleteMedia: "Delete “{{path}}” — {{author-name}}"

# Show editors' names and emails from DecapBridge
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Uncomment to test the admin locally with `npx decap-server` (no login needed)
# local_backend: true

site_url: https://deccan-times.vercel.app
display_url: https://deccan-times.vercel.app
logo_url: /favicon.svg

media_folder: src/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: articles
    label: News Stories
    label_singular: Story
    description: Every story published on the website. The newest story marked “Lead story” goes on top of the front page.
    folder: src/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{category}} ({{date | date('DD MMM YYYY')}})"
    sortable_fields: [date, title, category]
    view_filters:
      - { label: Lead stories, field: lead, pattern: true }
      - { label: Breaking, field: breaking, pattern: true }
    view_groups:
      - { label: Section, field: category }
    fields:
      - { label: Headline, name: title, widget: string }
      - { label: Short summary (one line under the headline), name: deck, widget: text, required: false }
      - label: Section
        name: category
        widget: select
        options: [Hyderabad, Telangana, Andhra Pradesh, India, World, Sports, Entertainment, Business, Opinion]
        default: Hyderabad
      - { label: Publish date & time, name: date, widget: datetime }
      - { label: Reporter / byline, name: author, widget: string, default: Deccan Times Desk }
      - { label: Main photo, name: image, widget: image, required: false }
      - { label: Photo description (for blind readers), name: imageAlt, widget: string, required: false }
      - { label: Photo caption, name: caption, widget: string, required: false }
      - { label: Photo credit, name: photoCredit, widget: string, required: false }
      - { label: Lead story (show big on the front page), name: lead, widget: boolean, default: false }
      - { label: Breaking news (show in the red ticker), name: breaking, widget: boolean, default: false }
      - { label: Story, name: body, widget: markdown }
